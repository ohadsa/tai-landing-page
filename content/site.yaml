about:
  eyebrow: "אודות"
  title: "נעים להכיר!"
  lead: "כתיבה היא לא מקצוע; כתיבה היא דרך חיים."
  paragraphs:
    - "הכוח המיוחד שאני מוצאת בכתיבה הוא היכולת להתרחק מהמציאות דווקא כדי להתקרב אליה. במקום שבו הדמיון פורש כנפיים, הנפש שלנו מתחילה לקלף את המציאות מהקליפות שלה ולחשוף את הלב החי והעדין שפועם מתחת. בכתיבה שלי אני אוהבת למתוח את גבולות המציאות, לאתגר את קווי המוסר ולנסות לתפוס רגשות עמומים בעזרת מטאפורות קיצוניות. בואו לחקור איתי את נפש האדם דרך ז'אנרים כמו סוריאליזם, מדע בדיוני, ריאליזם קסום, פנטזיה, ספקולציה, סאטירה, דיסטופיה, דרמה ואבסורד."
  portrait:
    src: "/images/about-portrait.jpg"
    alt: "הכותבת מחייכת ומחזיקה ציור של עץ וירח, מכחול בין שיניה"
  highlights:
    - "פורסמה בכתב העת שקט, החלון הצפוני ורשימת שדה"
    - "מנחה סדנאות כתיבה אינטימיות בעברית ובאנגלית"
    - "מתל אביב וזמינה להרצאה ולשיתופי פעולה"
    - "בוגרת תואר ראשון בחוג לקולנוע וטלוויזיה, במגמת תסריטאות"
    - "בוגרת תואר שני בספרות עם דגש כתיבה יוצרת"
    - "מנחת קבוצות בעלת ניסיון בעבודה עם נוער, חיילים וסטודנטים, ומנחת ימי עיבוד לחיילי מילואים"
    - "מלמדת כתיבה תסריטאית בחוג לקולנוע באוניברסיטת תל אביב"

