about:
  eyebrow: "אודות"
  title: "הכתיבה מתחילה במקום שבו הוודאות נגמרת."
  lead: "אני כותבת כדי להבין את הדברים שאנחנו כמעט אף פעם לא אומרות בקול."
  paragraphs:
    - "מיה לוין היא כותבת ומנחת סדנאות מתל אביב. המסות שלה עוסקות בזיכרון, ביחסים, בזהות יצירתית ובמרחק שבין החיים שדמיינו לבין החיים שאנחנו חיות."
    - "הכתיבה שלה פורסמה בכתבי עת עצמאיים והגיעה לקוראות דרך הרצאות, מעגלי כתיבה אינטימיים וסדנאות עומק. מבחינתה, כתיבה היא גם אמנות וגם דרך להקדיש תשומת לב מדויקת יותר לעולם."
  portrait:
    src: "/images/about-portrait.jpg"
    alt: "הכותבת מחייכת ומחזיקה ציור של עץ וירח, מכחול בין שיניה"
  highlights:
    - "פורסמה בכתב העת השקט, החלון הצפוני ורשימות שדה"
    - "מנחה סדנאות כתיבה אינטימיות בעברית ובאנגלית"
    - "מתל אביב וזמינה להרצאות ולשיתופי פעולה"

