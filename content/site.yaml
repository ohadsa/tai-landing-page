contact:
  eyebrow: "יצירת קשר"
  title: "בואו נדבר."
  description: "אני פנויה לענות לכל שאלה, הצעה או מחשבה שבא לכם לשתף."
  email: "tai.atar22@gmail.com"
  # Where submissions go. This is FormSubmit's alias for tai.atar22@gmail.com,
  # issued once the address was confirmed. Use the alias rather than the
  # /ajax/<address> form: the alias keeps the inbox out of the page source, and
  # the two are separate forms to FormSubmit — only the alias is activated.
  #
  # The alias has no JSON variant, so it answers a successful POST with a 302
  # back to the page rather than a JSON body. That is why the submit fetch uses
  # redirect: "manual" — see wasAccepted in lib/forms.ts.
  #
  # To move to another provider (Formspree, your own endpoint) just replace this
  # URL. Empty it and the form falls back to the visitor's mail client rather
  # than silently discarding messages.
  # form_action: "https://formsubmit.co/el/jotama"
  form_action: "https://formsubmit.co/el/juzanu"
  mailto_fallback_note: "הטופס ייפתח בתוכנת הדואר שלך."
  # Shown after the mail client is handed the message. Without it the button
  # looks broken on any device with no mail app registered.
  mailto_opened_message: "פתחנו את תוכנת הדואר שלך עם ההודעה מוכנה לשליחה. אם לא נפתח כלום, אפשר לכתוב ישירות לכתובת שלמעלה."
  # Used when a visitor presses שמירת מקום on a workshop card. The subject must
  # be one of the subjects listed below, and {workshop} becomes its title.
  reserve_subject: "הרשמה לסדנה"
  reserve_message: 'אשמח לשמור מקום בסדנה "{workshop}".'
  fields:
    name: "שם"
    email: "אימייל"
    phone: "טלפון"
    subject: "נושא"
    message: "הודעה"
    submit: "שליחת הודעה"
  success_message: "תודה. ההודעה נשלחה ואחזור אלייך בהקדם."
  error_message: "ההודעה לא נשלחה. אפשר לנסות שוב או לכתוב ישירות למייל שלמעלה."
